# Test copy of assets/oncodrivefml.CADD_GRCh38.conf: CADD v1.7 subset over the synthetic fixture
# elements (tests/data/oncodrivefml/cadd_subset.tsv.gz) and one core; everything else unchanged.
# OncodriveFML config for real CADD GRCh38 v1.7 whole-genome SNV scores.
# Column layout of CADD's whole_genome_SNVs.tsv.gz (tab-separated, bgzip+tabix):
#   0 Chrom  1 Pos  2 Ref  3 Alt  4 RawScore  5 PHRED
# We use PHRED (col 5) as the functional-impact score. Contigs are Ensembl-named
# (17, no 'chr'); the module strips 'chr' from mutations/elements to match.
[genome]
build = 'hg38'

[signature]
method = 'none'

[score]
file = 'cadd_subset.tsv.gz'
format = 'tabix'
chr = 0
chr_prefix = ''
pos = 1
ref = 2
alt = 3
score = 5

[statistic]
method = 'amean'
sampling = 100000
sampling_max = 1000000
sampling_chunk = 100
sampling_min_obs = 10

    [[indels]]
    include = False

[settings]
cores = 1
seed = 123
